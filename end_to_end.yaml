appId: id.rodakuu.rodakuu
---
# ==============================================================================
# RodaKuu End-to-End Automated Testing Flow (Maestro)
# ==============================================================================
# Menguji alur menyeluruh aplikasi rental kendaraan RodaKuu:
# 1. Autentikasi (Masuk dengan kredensial pengguna)
# 2. Katalog Kendaraan (Eksplorasi, Pencarian, & Filter Kategori)
# 3. Detail Kendaraan (Spesifikasi & Informasi Rental)
# 4. Formulir Pemesanan (Pemilihan Tanggal, Lokasi, Catatan, Ringkasan Harga)
# 5. Detail Pesanan & Pembatalan Pesanan
# 6. Riwayat Pesanan (Navigasi Tab Aktif & Selesai)
# 7. Profil Pengguna & Ubah Profil
# 8. Keluar Akun (Logout & Konfirmasi)
# ==============================================================================

# 1. Setup & Peluncuran Aplikasi
- launchApp:
    clearState: true

# ------------------------------------------------------------------------------
# 2. Autentikasi (Login)
# ------------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Masuk ke akun Anda"
    timeout: 10000

- assertVisible: "Masuk ke akun Anda"

# Input Email Pengguna
- tapOn: "nama@email.com"
- inputText: "rodaku-user@yopmail.com"

# Input Kata Sandi
- tapOn: "Minimal 8 karakter"
- inputText: "12345678"

- hideKeyboard

# Tekan Tombol Masuk
- tapOn: "Masuk"

# ------------------------------------------------------------------------------
# 3. Beranda & Katalog Kendaraan
# ------------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Mau sewa apa hari ini?"
    timeout: 15000

- assertVisible: "Mau sewa apa hari ini?"
- assertVisible: "Beranda"
- assertVisible: "Pesanan"
- assertVisible: "Profil"

# Uji Pencarian Kendaraan
- tapOn: "Cari merek atau nama"
- inputText: "Avanza"
- extendedWaitUntil:
    visible: "Toyota Avanza"
    timeout: 5000
- assertVisible: "Toyota Avanza"

# Hapus Pencarian
- tapOn: "Hapus pencarian"
- extendedWaitUntil:
    visible: "Daihatsu Xenia"
    timeout: 5000

# Uji Filter Kategori Jenis Kendaraan
- tapOn: "Motor"
- extendedWaitUntil:
    visible: "Honda Beat"
    timeout: 5000
- assertVisible: "Honda Beat"

- tapOn: "Mobil"
- extendedWaitUntil:
    visible: "Toyota Avanza"
    timeout: 5000
- assertVisible: "Toyota Avanza"

- tapOn: "Semua"

# ------------------------------------------------------------------------------
# 4. Detail Kendaraan
# ------------------------------------------------------------------------------
- tapOn: "Toyota Avanza"

- extendedWaitUntil:
    visible: "Spesifikasi"
    timeout: 10000

- assertVisible: "Toyota Avanza"
- assertVisible: "Spesifikasi"
- assertVisible: "Deskripsi"
- assertVisible: "Pesan Sekarang"

# ------------------------------------------------------------------------------
# 5. Formulir Pemesanan (Booking Form)
# ------------------------------------------------------------------------------
- tapOn: "Pesan Sekarang"

- extendedWaitUntil:
    visible: "Form Pemesanan"
    timeout: 10000

- assertVisible: "Form Pemesanan"
- assertVisible: "Toyota Avanza"

# Pilih Rentang Tanggal Sewa (3 hari sewa)
- tapOn: "Pilih tanggal mulai & selesai"
- extendedWaitUntil:
    visible: "Pilih"
    timeout: 5000
- tapOn: "Pilih"

# Isi Lokasi Pengambilan
- tapOn: "Contoh: Stasiun Gambir atau Bandara Soekarno Hatta"
- inputText: "Stasiun Gambir, Jakarta"
- hideKeyboard

# Isi Catatan Tambahan (Opsional)
- tapOn: "Catatan tambahan untuk pemilik rental"
- inputText: "Mohon siapkan unit dalam keadaan bersih"
- hideKeyboard

# Gulir ke Bawah dan Periksa Ringkasan Biaya
- scroll
- assertVisible: "Rincian Biaya"

# Tekan Tombol Buat Pesanan
- tapOn: "Buat Pesanan"

# ------------------------------------------------------------------------------
# 6. Detail Pesanan & Pembatalan
# ------------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Detail Pesanan"
    timeout: 15000

- assertVisible: "Detail Pesanan"
- assertVisible: "Menunggu konfirmasi"
- assertVisible: "Informasi Sewa"
- assertVisible: "Stasiun Gambir, Jakarta"
- assertVisible: "Rincian Pembayaran"

- scroll
- assertVisible: "Batalkan Pesanan"

# Uji Batalkan Pesanan (Status Menunggu)
- tapOn: "Batalkan Pesanan"

- extendedWaitUntil:
    visible: "Batalkan pesanan?"
    timeout: 5000

- assertVisible: "Pesanan yang dibatalkan tidak dapat dikembalikan."
- tapOn: "Batalkan"

- extendedWaitUntil:
    visible: "Dibatalkan"
    timeout: 10000
- assertVisible: "Dibatalkan"

# ------------------------------------------------------------------------------
# 7. Riwayat Pesanan (Tab Pesanan)
# ------------------------------------------------------------------------------
- tapOn: "Pesanan"

- extendedWaitUntil:
    visible: "Aktif"
    timeout: 5000

- assertVisible: "Selesai"

# Beralih ke Tab Selesai (Memverifikasi Pesanan yang Dibatalkan Muncul)
- tapOn: "Selesai"
- extendedWaitUntil:
    visible: "Dibatalkan"
    timeout: 5000
- assertVisible: "Dibatalkan"

# Beralih Kembali ke Tab Aktif
- tapOn: "Aktif"

# ------------------------------------------------------------------------------
# 8. Profil Pengguna & Ubah Profil
# ------------------------------------------------------------------------------
- tapOn: "Profil"

- extendedWaitUntil:
    visible: "rodaku-user@yopmail.com"
    timeout: 10000

- assertVisible: "rodaku-user@yopmail.com"
- assertVisible: "Ubah profil"
- assertVisible: "Keluar"

# Buka Formulir Ubah Profil
- tapOn: "Ubah profil"

- extendedWaitUntil:
    visible: "Ubah Profil"
    timeout: 5000

- assertVisible: "Nama lengkap"
- assertVisible: "Email"
- assertVisible: "Nomor telepon (opsional)"

# Simpan Pembaruan Profil
- tapOn: "Simpan"

- extendedWaitUntil:
    visible: "Keluar"
    timeout: 5000

# ------------------------------------------------------------------------------
# 9. Keluar Akun (Logout)
# ------------------------------------------------------------------------------
- tapOn: "Keluar"

- extendedWaitUntil:
    visible: "Keluar dari akun?"
    timeout: 5000

- assertVisible: "Anda perlu masuk lagi untuk memesan kendaraan."

# Konfirmasi Keluar dari Dialog
- tapOn:
    text: "Keluar"
    below: "Anda perlu masuk lagi untuk memesan kendaraan."

# Verifikasi Berhasil Kembali ke Layar Masuk
- extendedWaitUntil:
    visible: "Masuk ke akun Anda"
    timeout: 10000

- assertVisible: "Masuk ke akun Anda"
